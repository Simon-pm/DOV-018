
name: Portfolio DevOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t portfolio-devops .

      - name: Test Docker Image
        run: docker image inspect portfolio-devops

      - name: Run Container Test
        run: |
          docker run -d --name portfolio-test -p 8080:80 portfolio-devops
          sleep 5
          curl --fail http://localhost:8080
          docker stop portfolio-test
          docker rm portfolio-test

  deploy:
    name: Push to Docker Hub
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-devops:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-devops:latest

      - name: Deployment Complete
        run: echo "Docker Image pushed successfully!"

